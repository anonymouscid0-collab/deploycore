# ATTENTION : Ne fonctionne PAS nativement dans Termux.
version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: deploycore
      POSTGRES_PASSWORD: deploycore_password
      POSTGRES_DB: deploycore
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: deploycore
      MINIO_ROOT_PASSWORD: deploycore_minio_password
    ports: ["9000:9000", "9001:9001"]
